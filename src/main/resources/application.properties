# ==========================================
# 1. Server Configuration
# ==========================================
server.port=8080

# ==========================================
# 2. PostgreSQL (Supabase) Configuration
# ==========================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
SUPABASE_URL=${SUPABASE_URL}
SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}


# [QUAN TRỌNG] Tối ưu kết nối cho Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.statement_stream_settings.statement_timeout=300

spring.jpa.open-in-view=false
app.seeding.enabled=${APP_SEEDING_ENABLED:false}
app.attendance.early-buffer-minutes=${APP_ATTENDANCE_EARLY_BUFFER_MINUTES:15}
app.attendance.late-threshold-minutes=${APP_ATTENDANCE_LATE_THRESHOLD_MINUTES:10}
app.shift-request.min-days-ahead=${APP_SHIFT_REQUEST_MIN_DAYS_AHEAD:1}
app.shift-request.max-days-ahead=${APP_SHIFT_REQUEST_MAX_DAYS_AHEAD:14}

# ==========================================
# 3. Security, JWT & Firebase Authentication
# ==========================================
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}

# ==========================================
# 4. Neo4j Configuration (Local)
# ==========================================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password
spring.neo4j.connection-timeout=5s
spring.neo4j.max-transaction-retry-time=3s

# ==========================================
# 5. Redis Configuration (Local)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 6. OpenRouter AI Configuration (formerly Gemini)
# ==========================================
# OpenRouter API Keys (4 keys for rotation)
ai.provider=${AI_PROVIDER:openrouter}
ai.chat.pass1-timeout-ms=${AI_CHAT_PASS1_TIMEOUT_MS:12000}
openrouter.api-keys=${OPENROUTER_API_KEYS}
openrouter.model=${OPENROUTER_MODEL:deepseek/deepseek-v4-flash}
openrouter.pass1-model=${OPENROUTER_PASS1_MODEL:google/gemini-2.0-flash-001}
deepseek.api-key=${DEEPSEEK_API_KEY:}

# Legacy aliases (backward compat)


# ==========================================
# 7. File Upload & OpenAPI Configuration
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.products-dir=${APP_UPLOAD_PRODUCTS_DIR:public/uploads/products}
app.upload.products-max-bytes=${APP_UPLOAD_PRODUCTS_MAX_BYTES:2097152}
app.upload.staff-dir=${APP_UPLOAD_STAFF_DIR:public/uploads/staff}
app.debug.errors=${APP_DEBUG_ERRORS:true}
app.migration.auto-start=${APP_MIGRATION_AUTO_START:true}
app.sanitization.auto-start=${APP_SANITIZATION_AUTO_START:false}
app.ai.rate-limit.window-seconds=${APP_AI_RATE_LIMIT_WINDOW_SECONDS:60}
app.ai.rate-limit.max-requests=${APP_AI_RATE_LIMIT_MAX_REQUESTS:30}
app.ai.internal-fallback-enabled=${APP_AI_INTERNAL_FALLBACK_ENABLED:true}
# [DISABLED] Neo4j-First: Toàn bộ luồng chat giờ đi qua OpenRouter LLM.
# Dữ liệu Neo4j vẫn được truyền vào prompt để LLM có context sản phẩm.
app.ai.neo4j-first.enabled=${APP_AI_NEO4J_FIRST_ENABLED:false}
app.ai.neo4j-first.min-confidence=${APP_AI_NEO4J_FIRST_MIN_CONFIDENCE:1.0}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# 8. Logging Configuration
# ==========================================
logging.charset.console=UTF-8
logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1



spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
