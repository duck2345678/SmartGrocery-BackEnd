# ==========================================
# 1. Server Configuration
# ==========================================
server.port=8080

# ==========================================
# 2. PostgreSQL (Supabase) Configuration
# ==========================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# [QUAN TRỌNG] Tối ưu kết nối cho Supabase Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.seeding.enabled=${APP_SEEDING_ENABLED:true}
app.attendance.early-buffer-minutes=${APP_ATTENDANCE_EARLY_BUFFER_MINUTES:15}
app.attendance.late-threshold-minutes=${APP_ATTENDANCE_LATE_THRESHOLD_MINUTES:10}
app.shift-request.min-days-ahead=${APP_SHIFT_REQUEST_MIN_DAYS_AHEAD:1}
app.shift-request.max-days-ahead=${APP_SHIFT_REQUEST_MAX_DAYS_AHEAD:14}

# ==========================================
# 3. Security, JWT & Firebase Authentication
# ==========================================
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64}

# ==========================================
# 4. Neo4j Configuration (Local)
# ==========================================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password
spring.neo4j.connection-timeout=5s
spring.neo4j.max-transaction-retry-time=3s

# ==========================================
# 5. Redis Configuration (Local)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 6. Gemini AI Configuration
# ==========================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ==========================================
# 7. File Upload & OpenAPI Configuration
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.products-dir=${APP_UPLOAD_PRODUCTS_DIR:public/uploads/products}
app.upload.products-max-bytes=${APP_UPLOAD_PRODUCTS_MAX_BYTES:2097152}
app.upload.staff-dir=${APP_UPLOAD_STAFF_DIR:public/uploads/staff}
app.debug.errors=${APP_DEBUG_ERRORS:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html 
